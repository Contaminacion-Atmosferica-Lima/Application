# Devuelve el grafo global filtrado por distrito y coloreado según contaminante.

tags:
  - Global Graph

parameters:
  - in: query
    name: distrito
    schema:
      type: string
    required: false
    description: >
      Nombre del distrito a filtrar. 

  - in: query
    name: pollutant
    schema:
      type: string
      enum: [PM10, PM2_5, NO2, AVG]
      default: AVG
    required: false
    description: >
      Contaminante usado para clasificar y colorear los nodos (PM10, PM2.5, NO2 o AVG).

  - in: query
    name: mode
    schema:
      type: string
      enum: [OMS, MINAM]
      default: OMS
    required: false
    description: >
      Norma aplicada para clasificar los niveles de contaminación.

  - in: query
    name: th
    schema:
      type: number
      minimum: 1
      maximum: 50
      default: 10
    required: false
    description: >
      Distancia máxima (en Km) para crear edges entre nodos del grafo global.

responses:
  200:
    description: Grafo global generado correctamente.
    content:
      application/json:
        example:
          total_nodes: 210
          total_edges: 563
          nodes:
            - id: "SAN_BORJA_2024-05-01"
              distrito: "SAN_BORJA"
              fecha: "2024-05-01"
              latitud: -12.09
              longitud: -77.01
              pm10: 52.3
              pm2_5: 28.1
              no2: 18.2
              avg: 32.13
              color: "#fffb00"
          edges:
            - source: "SAN_BORJA_2024-05-01"
              destination: "JESUS_MARIA_2024-05-01"
              distance: 5.73
