<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Lima AirGraph{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  />
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
      🌫️ Lima AirGraph
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

      <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('home') }}">Mapa interactivo</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('global_viewer') }}">Grafo global</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/apidocs">API (Swagger)</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-3">
  {% block content %}{% endblock %}
</main>

<footer class="bg-black text-center text-secondary py-2 small mt-3 border-top border-secondary">
  Proyecto TB2 · Complejidad Algorítmica · Mapa de contaminación del aire en Lima Metropolitana
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
